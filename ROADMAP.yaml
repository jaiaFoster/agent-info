#
# Structured, machine-readable roadmap derived from AGENTS.md's Ticket
# Registry, Expansion Strategy, and Buyer Validation Strategy sections.
# AGENTS.md remains the living source of truth; this file is a derived
# summary for AI/executive consumption, regenerated whenever the registry
# changes materially.

schema_version: 1
last_updated_utc: "2026-07-27T20:48:00Z"

# Reconciled by SPRINT-005-GOV (2026-07-25). The prior infrastructure-era
# north_star and phase list are preserved in AGENTS.md's "Current Project
# Status" history, not deleted -- this file states only the current,
# active version, per this sprint's "no contradictory governance" goal.
north_star: >
  Continuously transform public evidence into explainable, high-confidence
  market decisions before spending money on customer acquisition.

operating_philosophy: >
  Evidence -> Intelligence -> Confidence -> Decision -> Paid Identification
  -> Outreach -> Revenue. Each phase gates the next: a decision to spend
  money identifying a contact should follow an explicit, versioned
  confidence judgment (core/confidence/foundation.py), not just a raw
  opportunity score. SPRINT-004 (2026-07-25) built the Evidence/
  Intelligence/Confidence automation; SPRINT-005 targets Confidence
  calibration and an explicit Decision policy before any Paid
  Identification pilot.

