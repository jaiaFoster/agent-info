expansion_strategy:
  florida:
    status: "continue expanding"
    proven: "Hillsborough County (end to end: ingestion -> provenance -> canonical storage -> linking -> intelligence -> matching -> outreach)"
    next_counties_ranked:
      # Per SPRINT-001 / docs/research/market-ranking.md
      - rank: 1
        county: "Pinellas County, FL"
        note: >
          Parcel/assessor adapter (PCPAO bulk files) implemented under
          SPRINT-002 and validated against real, checksummed live data
          under SPRINT-003 (schemas verified, bounded ingestion succeeded
          in an isolated database, zero critical integrity failures).
          Production ingestion still not yet approved. Recorder (Clerk)
          adapter deferred. Shared ownership context with Kyle's
          INGEST-002 ticket noted but no longer treated as blocking (see
          AGENTS.md registry reconciliation, SPRINT-004) — the underlying
          question of which implementation Kyle intended is still
          genuinely open whenever Jaia/Kyle want to look at it.
      - rank: 2
        county: "Orange County, FL"
      - rank: 3
        county: "Pasco County, FL"
      - rank: 4
        county: "Duval County, FL"
    blocking_ticket: "FL-ADAPTER-001"
  phoenix_arizona:
    ticket: "AZ-ADAPTER-001"
    county: "Maricopa County, AZ"
    purpose: "first out-of-state architecture-validation target"
    status: "OPEN — ticketed 2026-07-26, no ingestion/adapter work started"
    confirmed_by: "SPRINT-001 market ranking — keep unmodified; ranked #1 of 13 candidates (score 20)"
    readiness_assessment: >
      SPRINT-003 produced a readiness assessment (not onboarding work):
      primary assessor source is expected to be a proven ArcGIS FeatureServer
      pattern (lower-risk than Pinellas's novel access mechanism), but two
      decisions need Jaia's sign-off before adapter code starts — extending
      the shared asset_linker.py identifier vocabulary for APN (Maricopa has
      no FOLIO/PIN/STRAP equivalent), and whether to fund the Maricopa
      Recorder's paid bulk deed data or scope the first pass as
      parcel/assessor-only. See docs/research/MARICOPA_READINESS_ASSESSMENT.md.
  troy_new_york:
    ticket: "NY-ADAPTER-001"
    county: "Rensselaer County (Troy), extended in scope to Albany County"
    purpose: "second out-of-state architecture-validation target; Albany added per Tim's request 2026-07-26 (not part of SPRINT-001's evaluated candidate set — needs its own source-probe)"
    status: "OPEN — ticketed 2026-07-26, no ingestion/adapter work started"
    risk_note: >
      SPRINT-001 found population declining since 2020 (-1,317 residents
      2021-2023) and the weakest data access (permits, probate) of any
      market researched. Recommendation: keep, but explicitly as a
      non-revenue architecture-validation bet, not a market-opportunity one
      — consistent with how AGENTS.md already frames it.
    advantage: >
      NYS GIS Clearinghouse publishes one free statewide parcel dataset
      covering both Rensselaer and Albany, so one parcel adapter likely
      serves both counties -- cheaper than Maricopa's or Florida's
      county-by-county pattern. Deed/recorder side is still per-county
      (Rensselaer County Clerk, Albany County Clerk).

market_discovery:
  ticket: "MARKET-001"
  status: "OPEN — ticketed 2026-07-26"
  purpose: >
    National investor-purchase heatmap (Redfin Data Center free quarterly
    metro data, Census ACS fallback) to help prioritize which markets LUX
    evaluates next for expansion. Upstream of and distinct from the
    per-jurisdiction adapter tickets above and from INTEL-*'s scoring of
    LUX's own already-ingested evidence. Small, standalone scope -- new
    ingestion job + one new lightweight table, no core/ or adapter-boundary
    changes required.
  deprioritized_candidates:
    - name: "Austin (Travis County, TX)"
      reason: "non-disclosure state — sale price isn't public record, breaks LUX's evidence-based deterministic model"
    - name: "Salt Lake County, UT"
      reason: "same non-disclosure-state issue"

