known_constraints:
  - "Merge authority defaults to Jaia; a worker may merge autonomously only when its own sprint ticket explicitly grants quality-gated merge authority AND every required gate passes. Absent that explicit grant, merges remain manual — see AGENTS.md's Merge Authority section (reconciled by SPRINT-005-GOV, 2026-07-25)."
  - "Paid actions, outreach/contact, production-ingestion approval, destructive production operations, and identity-resolution-policy changes always require Jaia's explicit approval regardless of any sprint's merge grant."
  - "Codex/coding agents may run bounded dry-runs and evidence audits without additional approval; linker write mode, scoring/matching writes, outreach/contact actions, and destructive DB operations all require Jaia's explicit approval."
  - "Core never imports from adapters/; adapters import Core schemas only."
  - "Unresolved is preferable to false resolution — no fuzzy matching, no guessed Asset links."

