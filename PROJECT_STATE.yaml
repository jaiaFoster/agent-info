schema_version: 1
last_updated_utc: "2026-07-26T00:00:00Z"
last_updated_by: "SPRINT-006 follow-up (Production schema readiness workflow guard)"

active_expansion_work:
  ticket: "SPRINT-006 (current follow-up)"
  status: "Canonical Fact Engine PRs #58-#63 merged. Credentialed review runs show production DB is missing canonical_facts; current follow-up guards the review workflow so it stops cleanly at schema readiness."
  summary: >
    SPRINT-006 creates the reusable deterministic fact layer beneath
    intelligence. Foundation PR #58 added the canonical_facts table,
    repository, producer registry, eight initial producers, derived/profile
    foundation, and buyer shadow helper. PR #59 added richer derived
    statistics, profile completeness/contradiction reporting, and a read-only
    fact inventory/parity audit. PR #60 added a fact-backed confidence bridge
    and buyer-intelligence sidecar shadow report. PR #61 added a first-write
    review packet that previews asserted and derived coverage before any
    production fact write. PR #62 added a manual GitHub Actions workflow to
    generate those review artifacts in a DATABASE_URL-backed environment. The
    first run showed the connected production database is missing
    canonical_facts, so current work hardens live DB schema readiness and
    blocks review execution until migration is explicitly approved/applied.
    A follow-up guard prevents downstream audit/shadow steps from crashing
    after the schema gate fails.
  known_issue: >
    Production fact writes and legacy consumer cutover remain deferred until
    reviewed. Current follow-up is non-destructive/read-only aside from code.
  full_detail: "docs/architecture/CANONICAL_FACT_ENGINE.md, docs/operations/SPRINT_006_VALIDATION_PACKET.md, AGENTS.md"

project:
  name: "LUX"
  full_name: "Linked Unified Exchange"
  description: >
    Market-intelligence platform that discovers, scores, and matches
    participants in fragmented markets. Adapter #1 (validation vertical) is
    residential real estate wholesale deals, Tampa Bay FL (Hillsborough
    County). Core is intentionally market-agnostic.
  repository: "fsassaman-commits/lux-core"

current_phase: "Canonical Fact Engine Expansion — Production Schema Readiness Workflow Guard"

current_milestone:
  name: "MVP-001 — First Dollar"
  definition: >
    Generate one successful wholesale transaction entirely through LUX
    intelligence: identify a motivated seller from canonical public
    evidence, identify a compatible buyer from buyer intelligence, and close
    that match into an actual completed deal. A qualified lead and an
    approved outreach packet are necessary steps, not the milestone itself.
  status: "in progress"
  blocking_path:
    - "LEADGEN-002 (run production migration)"
    - "LEADGEN-003 (lawful-use attestation)"
    - "LEADGEN-004 (provider keys: BatchData, DNC.com)"
    - "LEADGEN-005 (activate live providers, first bounded live skip-trace batch)"
    - "OUTREACH-003 (opportunity->lead skip-trace loop into approval queue)"

infrastructure_status: "complete"
infrastructure_summary: >
  Canonical data model, public-record ingestion, immutable provenance
  pipeline, deterministic normalization, targeted parcel enrichment,
  deterministic Transaction->Asset linking, and read-only computed graph
  queries (GRAPH-001) are all live in production. Engineering priority has
  shifted from building ingestion infrastructure to improving derived
  intelligence and closing the loop to a real transaction.

intelligence_status: "v1 live + continuous automation (SPRINT-004)"
intelligence_summary: >
  INTEL-001 (seller pressure) and INTEL-002 (buyer demand) v1 are live,
  scoring canonical evidence into explainable, versioned projections.
  DATA-009 reconnected /api/opportunities and /api/matches to those
  projections. MATCH-001 persists ranked candidate matches with outcome
  tracking. SPRINT-004 added continuous evidence scheduling, targeted (not
  full-batch) rescoring, a versioned confidence layer distinct from
  opportunity strength, continuous prioritization with rank history, and
  read-only paid-action simulation (core/simulation/policy.py) -- all
  strictly upstream of any paid action. OUTREACH-001 v1 ships
  human-reviewed, compliance-gated outreach drafts, currently running
  against mock contact providers pending Lead Engine go-live.

