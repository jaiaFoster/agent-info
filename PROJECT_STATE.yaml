current_milestone:
  name: "MVP-001 — First Dollar"
  definition: >
    Generate one successful wholesale transaction entirely through LUX
    intelligence: identify a motivated seller from canonical public
    evidence, identify a compatible buyer from buyer intelligence, and close
    that match into an actual completed deal. A qualified lead and an
    approved outreach packet are necessary steps, not the milestone itself.
  status: "in progress"
  blocking_path:
    - "LEADGEN-002 (run production migration)"
    - "LEADGEN-003 (lawful-use attestation)"
    - "LEADGEN-004 (provider keys: BatchData, DNC.com)"
    - "LEADGEN-005 (activate live providers, first bounded live skip-trace batch)"
    - "OUTREACH-003 (opportunity->lead skip-trace loop into approval queue)"

infrastructure_status: "complete"
infrastructure_summary: >
  Canonical data model, public-record ingestion, immutable provenance
  pipeline, deterministic normalization, targeted parcel enrichment,
  deterministic Transaction->Asset linking, and read-only computed graph
  queries (GRAPH-001) are all live in production. Engineering priority has
  shifted from building ingestion infrastructure to improving derived
  intelligence and closing the loop to a real transaction.

intelligence_status: "v1 live + continuous automation (SPRINT-004)"
intelligence_summary: >
  INTEL-001 (seller pressure) and INTEL-002 (buyer demand) v1 are live,
  scoring canonical evidence into explainable, versioned projections.
  DATA-009 reconnected /api/opportunities and /api/matches to those
  projections. MATCH-001 persists ranked candidate matches with outcome
  tracking. SPRINT-004 added continuous evidence scheduling, targeted (not
  full-batch) rescoring, a versioned confidence layer distinct from
  opportunity strength, continuous prioritization with rank history, and
  read-only paid-action simulation (core/simulation/policy.py) -- all
  strictly upstream of any paid action. OUTREACH-001 v1 ships
  human-reviewed, compliance-gated outreach drafts, currently running
  against mock contact providers pending Lead Engine go-live.

